name: Build APK

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # publication de la release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests (protocole Bluetooth + programmes)
        run: ./gradlew --no-daemon :domyos-ble-core:test :app:testReleaseUnitTest

      # Signature stable (facultatif) : ajoutez les secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      # Sans eux, l'APK est signé avec une clé de debug éphémère (installation OK, mais pas de mise à jour par-dessus).
      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p signing && echo "$KEYSTORE_BASE64" | base64 -d > signing/release.jks
            echo "Signature release configurée"
          else
            echo "::warning::Pas de secret KEYSTORE_BASE64 : APK signé avec une clé de debug"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk cadence.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cadence-apk
          path: cadence.apk
          if-no-files-found: error

      # À chaque push sur master : release GitHub avec l'APK en pièce jointe.
      # Lien fixe pour le téléphone : https://github.com/<owner>/<repo>/releases/latest/download/cadence.apk
      - name: Publier la release
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.${{ github.run_number }}
        run: |
          gh release create "$TAG" cadence.apk \
            --target "$GITHUB_SHA" \
            --title "Cadence $TAG" \
            --notes "Build ${GITHUB_SHA::7} — $(git log -1 --format=%s)" \
            --latest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
